<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07060b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>В Точку</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Manrope:wght@500;700;800&display=swap">
<link rel="stylesheet" href="/style.css">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
</head>
<body>
<div id="boot"><style>
#boot{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;background:radial-gradient(ellipse at 50% 40%,#1a1424 0%,#07060b 70%);transition:opacity .5s}
#boot.out{opacity:0;pointer-events:none}
#boot img{width:120px;height:120px;object-fit:contain;filter:drop-shadow(0 0 18px rgba(232,196,106,.35));animation:bootGlow 2.2s ease-in-out infinite}
#boot b{font:700 30px 'Cormorant Garamond',Georgia,serif;letter-spacing:.06em;background:linear-gradient(180deg,#fff1c4,#e8c46a 55%,#a77d2c);-webkit-background-clip:text;background-clip:text;color:transparent}
#boot i{width:150px;height:3px;border-radius:3px;background:rgba(232,196,106,.15);overflow:hidden;position:relative}
#boot i::after{content:'';position:absolute;inset:0;width:40%;background:linear-gradient(90deg,transparent,#e8c46a,transparent);animation:bootRun 1.3s linear infinite}
@keyframes bootRun{from{transform:translateX(-100%)}to{transform:translateX(260%)}}
@keyframes bootGlow{50%{filter:drop-shadow(0 0 28px rgba(232,196,106,.6))}}
</style><img src="/img/logo.webp?v=1" alt=""><b>В Точку</b><i></i></div>
<div id="app">
  <div id="shake">
    <div class="bg"></div>
    <div class="motes"></div>
    <main id="screen"></main>
  </div>
  <canvas id="fx"></canvas>
  <div id="announce"></div>
  <div class="banner" id="banner"></div>
  <div id="overlay"></div>
  <div id="toast"></div>
</div>
<div id="rotate"><div><div class="ph"></div><div class="gold-text" style="font-family:var(--font-title);font-size:28px;font-weight:700">Поверните телефон</div><div class="hint">«В Точку» рассчитана на горизонтальный экран</div></div></div>
<script src="/viewport.js"></script>
<script src="/brand.js"></script>
<script src="/i18n.js"></script>
<script src="/cards-light.js"></script>
<script src="/cards-sil.js"></script>
<script src="/cards-royal.js"></script>
<script src="/cards.js"></script>
<script src="/fx.js"></script>
<script src="/qrcode.js"></script>
<script src="/voice.js"></script>
<script src="/music.js"></script>
<script src="https://accounts.google.com/gsi/client" async></script>
<script src="/room-cozy.js"></script>
<script src="/room-office.js"></script>
<script src="/room-picnic.js"></script>
<script src="/engine.js"></script>
<script src="/tutorial.js"></script>
<script src="/client.js"></script>
</body>
</html>
